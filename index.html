<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疾鉴 · 产品原型体验</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A02636'/%3E%3Ctext x='32' y='43' font-size='36' font-weight='700' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif'%3E%E7%96%BE%3C/text%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif;
  background: #F2F4F6;
  color: #2C3E50;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.page { width: 100%; max-width: 640px; }
.head {
  text-align: center;
  margin-bottom: 40px;
}
.badge {
  display: inline-block;
  background: #A02636;
  color: #FFFFFF;
  font-size: 15px;
  padding: 8px 20px;
  border-radius: 999px;
  margin-bottom: 20px;
}
h1 { font-size: 34px; color: #1E4E79; margin-bottom: 12px; }
.head p { font-size: 15px; color: #5D6D7E; line-height: 1.8; }
.card {
  background: #FFFFFF;
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(30, 78, 121, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.card .num {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #E9F1F8;
  color: #1E4E79;
  font-weight: 700;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.card h2 { font-size: 20px; color: #1E4E79; margin-bottom: 10px; }
.card p { font-size: 14px; color: #5D6D7E; line-height: 1.8; margin-bottom: 18px; }
.btn {
  display: inline-block;
  background: #2A6DB5;
  color: #FFFFFF;
  text-decoration: none;
  font-size: 17px;
  font-weight: 600;
  padding: 14px 40px;
  border-radius: 999px;
  min-height: 48px;
  line-height: 20px;
  transition: background 0.2s;
}
.btn:hover { background: #1E5A9E; }
.btn:active { background: #1A4F8C; }
.card.red .btn { background: #A02636; }
.card.red .btn:hover { background: #8A1F2E; }
.card.red .btn:active { background: #771A27; }
.card.red .num { background: #F6E4E6; color: #A02636; }
.foot {
  text-align: center;
  font-size: 13px;
  color: #85929E;
  margin-top: 12px;
  line-height: 1.8;
}
@media (max-width: 480px) {
  h1 { font-size: 28px; }
  .card { padding: 22px 18px; }
  .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <span class="badge">疾鉴 · 产品原型</span>
    <h1>扫码即用 · 两个交互 Demo</h1>
    <p>点击下方按钮进入体验，无需下载安装，手机、电脑均可打开。</p>
  </div>

  <div class="card red">
    <div class="num">1</div>
    <h2>高血压疾病认知决策树</h2>
    <p>从「发现血压偏高」出发，按 6 级决策路径完成风险判断分流、复测指引、就医边界、日常管控与误区辟谣。</p>
    <a class="btn" href="decision-tree.html">进入决策树体验</a>
  </div>

  <div class="card">
    <div class="num">2</div>
    <h2>高血压健康素养测评</h2>
    <p>10 道单选题覆盖四大维度，百分制评分，自动生成维度正确率、薄弱项分析与错题回顾。</p>
    <a class="btn" href="quiz.html">进入测评体验</a>
  </div>

  <div class="foot">本页面为产品原型演示，内容仅用于健康科普教育，不构成医疗诊断或治疗建议。</div>
</div>
</body>
</html>
